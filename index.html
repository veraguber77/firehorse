<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Home page defaults. The build writes each page's own (vite-plugin-site.js, src/pageMeta.js). -->
    <title>Firehorse — 2026 design competition</title>
    <meta name="description" content="Firehorse is an open design competition across five categories. Free to enter, judged by senior designers. Submissions close November 14, 2026." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Firehorse" />
    <meta property="og:title" content="Firehorse — 2026 design competition" />
    <meta property="og:description" content="Firehorse is an open design competition across five categories. Free to enter, judged by senior designers. Submissions close November 14, 2026." />
    <meta name="twitter:card" content="summary" />
    <!-- Kindling 300 / Cinder 600, the page backgrounds. Kept in step with a chosen theme below and in src/theme.js. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F5EC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030625" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" />
    <link rel="preload" as="style" href="https://use.typekit.net/jhd2bcu.css" />
    <script>
      // Brand fonts, without holding up the page: the Adobe stylesheet loads in the background and
      // the page shows the Arial fallbacks (same widths, see index.css) until every weight has
      // downloaded. Then html.fonts-ready switches all the text at once. Waiting for the files
      // matters: the kit's font-display is "auto", which hides text while its font downloads.
      window.brandFonts = new Promise(function (done) {
        var link = document.createElement('link')
        link.rel = 'stylesheet'
        link.href = 'https://use.typekit.net/jhd2bcu.css'
        // Safari holds the page back for any stylesheet that applies, so it applies once it's here.
        link.media = 'print'
        link.onload = function () {
          link.onload = null
          link.media = 'all'
          var fonts = [
            '900 1em rl-folklor',
            '700 1em itc-avant-garde-gothic-pro',
            '400 1em neue-haas-grotesk-text',
            '500 1em neue-haas-grotesk-text',
            '700 1em neue-haas-grotesk-text',
          ]
          Promise.all(
            fonts.map(function (font) {
              return document.fonts.load(font)
            }),
          ).then(function () {
            document.documentElement.classList.add('fonts-ready')
            done()
          }, done)
        }
        link.onerror = done
        document.head.appendChild(link)
      })
    </script>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('firehorse-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (tag) {
          tag.content = theme === 'dark' ? '#030625' : '#F6F5EC'
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
